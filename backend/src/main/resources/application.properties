server.port=${PORT:8080}

# allowPublicKeyRetrieval=true is required for MySQL 8 caching_sha2_password over
# non-SSL dev connections (matches flyway.conf). Use SSL/TLS for production.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/janvoice_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Hibernate auto-detects the dialect from the JDBC connection (MySQL for the
# main profile, H2 for the test profile). Do not pin a dialect here - MySQL8Dialect
# is deprecated and explicit pins are unnecessary.

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

spring.h2.console.enabled=${H2_CONSOLE:false}

session.token.secret=${SESSION_TOKEN_SECRET:}

# Google Gemini API key for AI material classification.
# Never hardcode or commit this value. Set in environment / Railway dashboard.
gemini.api.key=${GEMINI_API_KEY:}
# Vision-capable Gemini model for classification (free-tier friendly).
gemini.classification.model=${GEMINI_CLASSIFICATION_MODEL:gemini-2.0-flash}
# Maximum image size (bytes) accepted for AI classification.
gemini.classification.max-image-bytes=${GEMINI_MAX_IMAGE_BYTES:10485760}

# --- Actuator (health check for Railway) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

