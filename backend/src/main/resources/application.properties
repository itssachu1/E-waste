server.port=${SERVER_PORT:8080}

# allowPublicKeyRetrieval=true is required for MySQL 8 caching_sha2_password over
# non-SSL dev connections (matches flyway.conf). Use SSL/TLS for production.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/janvoice_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Hibernate auto-detects the dialect from the JDBC connection (MySQL for the
# main profile, H2 for the test profile). Do not pin a dialect here —
# MySQL8Dialect is deprecated (HHH90000026) and explicit pins are unnecessary
# (HHH90000025).

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

spring.h2.console.enabled=${H2_CONSOLE:false}

# Empty default lets SessionTokenServiceImpl apply its designed fallback
# (temporary dev-session secret + warning) when SESSION_TOKEN_SECRET is unset.
session.token.secret=${SESSION_TOKEN_SECRET:}
