spring.datasource.url=jdbc:h2:mem:janvoice_ai_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Let Flyway own the schema (V1..V7 create tables + seed the 30 material
# records). Hibernate must NOT drop/recreate ("create-drop") after Flyway runs,
# otherwise the migrated seed data is wiped and every seeded-data test fails.
spring.jpa.hibernate.ddl-auto=none
# Dialect auto-detected from the H2 connection.

session.token.secret=test-session-secret-change-me-32chars
