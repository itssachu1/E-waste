# Production profile — activated via SPRING_PROFILES_ACTIVE=prod on Railway.
# No dev fallback for session secret: it MUST be provided via SESSION_TOKEN_SECRET env var.
# ddl-auto=validate: never auto-modify schema (Flyway owns migrations).

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Never auto-generate a session secret in production — hard fail if missing.
# (SessionTokenServiceImpl already enforces this when not in default profile.)

# Logging: quieter than dev
logging.level.root=WARN
logging.level.com.janvoice=INFO

# Actuator: expose only health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
